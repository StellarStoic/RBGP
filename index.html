    <div class="button-container">

        <button id="rogljicev-km">Rogljičev Km</button>
    </div>
    <!-- The Modal -->
<div id="myModal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="times"></div>
        <h2 id="modal-title"></h2>
        <div id="modal-text"></div>
    </div>
</div>

    <div id="top101-overall"></div>
    <div id="search-data-switch" class="search-data-switch is-goni-pony" role="status">
        <span id="search-data-notice">Search in the general Goni Pony results</span>
        <button id="search-data-toggle" class="search-data-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch search to Rogljičev Kilometer results">
            <span class="search-data-toggle-label search-data-toggle-label-general">Goni Pony</span>
            <span class="search-data-toggle-label search-data-toggle-label-rogljicev">Rogljičev Km</span>
            <span class="search-data-toggle-knob" aria-hidden="true"></span>
        </button>
    </div>
    <div id="results"></div>
    <div id="times"></div>
    <section id="chart-container" aria-labelledby="chart-title">
        <div class="chart-heading">
            <div class="chart-heading-row">
                <div>
                    <h2 id="chart-title">RedBull Goni Pony Participant time comparison</h2>
                    <p>Faster finish times appear higher. Swipe horizontally on mobile to compare event years.</p>
                </div>
                <button id="chart-snapshot-button" type="button" title="Download chart as PNG" aria-label="Download chart as PNG">
                    <img src="pics/cameraIcon.png" alt="">
                    <span>Snapshot</span>
                </button>
            </div>
        </div>
        <div class="chart-scroll">
            <div class="chart-canvas-wrap">
                <canvas id="myChart" role="img" aria-label="Selected participants' finish times compared across event years"></canvas>
            </div>
        </div>
    </section>

    <!-- Footer with hyperlinks -->
